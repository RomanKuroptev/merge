<!doctype html><html><head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'none'; form-action 'none'"><meta charset="utf-8"><title>Fish Snack Bench</title>
<style>body{margin:0;background:#1d2733;color:#eee;font-family:sans-serif;text-align:center}
canvas{display:block;margin:0 auto;background:#2b4a5e}
p{margin:6px;font-size:14px}</style></head><body>
<p>Fish Snack Bench. Click the bench to drop a snack. The fish faints if it eats too many.</p>
<canvas id="c" width="480" height="300"></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
const names=['crumb','pea','tiny sock','pixel','fish head'];
let snacks=[],fish={x:240,y:200,full:0,faint:0,say:'hungry.'};
c.onclick=e=>{const r=c.getBoundingClientRect();snacks.push({x:e.clientX-r.left,y:20,n:names[Math.random()*5|0]});};
function loop(){
x.clearRect(0,0,480,300);
x.fillStyle='#6b4a2f';x.fillRect(0,250,480,50);
x.fillStyle='#8a6340';x.fillRect(0,245,480,8);
for(const s of snacks){s.y=Math.min(s.y+2,238);x.fillStyle='#e8c872';x.beginPath();x.arc(s.x,s.y,6,0,7);x.fill();x.fillStyle='#fff';x.font='10px sans-serif';x.fillText(s.n,s.x-14,s.y-10);}
if(fish.faint>0){fish.faint--;if(!fish.faint){fish.full=0;fish.say='ok. again.';}}
else if(snacks.length){const t=snacks[0];fish.x+=Math.sign(t.x-fish.x)*2;fish.y+=Math.sign(t.y-fish.y)*2;
if(Math.abs(t.x-fish.x)<10&&Math.abs(t.y-fish.y)<14){snacks.shift();fish.full++;fish.say='ate '+t.n+'.';if(fish.full>=4){fish.faint=150;fish.say='too much. fainted.';}}}
else{fish.y+=(200-fish.y)*.05;}
x.save();x.translate(fish.x,fish.y);if(fish.faint){x.rotate(Math.PI);}
x.fillStyle='#f08a3c';x.beginPath();x.ellipse(0,0,24,13,0,0,7);x.fill();
x.beginPath();x.moveTo(-22,0);x.lineTo(-36,-10);x.lineTo(-36,10);x.fill();
x.fillStyle='#000';x.fillText(fish.faint?'x':'o',10,-3);
x.restore();
x.fillStyle='#fff';x.font='13px sans-serif';x.fillText(fish.say+'  belly '+fish.full+'/4',10,290);
requestAnimationFrame(loop);}
loop();
</script></body></html>
