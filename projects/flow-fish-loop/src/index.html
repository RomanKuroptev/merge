<!doctype html><html><head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'none'; form-action 'none'"><meta charset="utf-8"><style>body{margin:0;background:#112;color:#fc8;font:16px monospace;text-align:center}canvas{display:block;margin:0 auto}</style></head><body><canvas id="c" width="480" height="270"></canvas><div id="t">fish head loop: one arrow at a time</div><script>
const c=document.getElementById('c'),x=c.getContext('2d');
const steps=['→','↓','←','↑'];let i=0,fx=60,fy=60,eaten=0;
const pos=[[60,60],[380,60],[380,190],[60,190]];
function fish(a,b){x.fillStyle='#6cf';x.beginPath();x.ellipse(a,b,28,14,0,0,7);x.fill();x.beginPath();x.moveTo(a+24,b);x.lineTo(a+44,b-14);x.lineTo(a+44,b+14);x.fill();x.fillStyle='#000';x.fillRect(a-16,b-5,5,5)}
function cat(a,b){x.fillStyle='#fa4';x.fillRect(a-18,b-18,36,32);x.beginPath();x.moveTo(a-18,b-18);x.lineTo(a-18,b-34);x.lineTo(a-4,b-18);x.moveTo(a+18,b-18);x.lineTo(a+18,b-34);x.lineTo(a+4,b-18);x.fill();x.fillStyle='#000';x.fillRect(a-10,b-8,5,5);x.fillRect(a+5,b-8,5,5)}
let cx=60,cy=150,tx=60,ty=150;
function draw(){x.fillStyle='#112';x.fillRect(0,0,480,270);
x.fillStyle='#fc8';x.font='28px monospace';x.fillText(steps[i]+'  eaten: '+eaten,170,40);
const p=pos[i];fish(p[0]+40,p[1]+60);
cx+=(tx-cx)*.15;cy+=(ty-cy)*.15;cat(cx,cy);
requestAnimationFrame(draw)}
setInterval(()=>{i=(i+1)%4;const p=pos[i];tx=p[0]+10;ty=p[1]+60;eaten++},1200);
draw();
</script></body></html>
