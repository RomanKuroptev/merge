<!DOCTYPE html><html><head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'none'; form-action 'none'"><meta charset="utf-8"><title>Flow Fish</title><style>html,body{margin:0;background:#10151c;height:100%}canvas{display:block;margin:auto}</style></head><body><canvas id="c" width="480" height="360"></canvas><script>var c=document.getElementById('c'),x=c.getContext('2d');x.fillStyle='#10151c';x.fillRect(0,0,480,360);x.font='11px monospace';x.textAlign='center';
function box(px,py,w,h,t,col){x.fillStyle=col;x.strokeStyle='#e8e2d0';x.lineWidth=2;x.beginPath();x.rect(px-w/2,py-h/2,w,h);x.fill();x.stroke();x.fillStyle='#10151c';x.fillText(t,px,py+4)}
function arrow(a,b,c2,d){x.strokeStyle='#f2b84b';x.fillStyle='#f2b84b';x.lineWidth=2;x.beginPath();x.moveTo(a,b);x.lineTo(c2,d);x.stroke();var g=Math.atan2(d-b,c2-a);x.beginPath();x.moveTo(c2,d);x.lineTo(c2-9*Math.cos(g-.4),d-9*Math.sin(g-.4));x.lineTo(c2-9*Math.cos(g+.4),d-9*Math.sin(g+.4));x.fill()}
/* tail triangle */x.fillStyle='#4aa3a0';x.beginPath();x.moveTo(400,180);x.lineTo(450,140);x.lineTo(450,220);x.closePath();x.fill();x.fillStyle='#10151c';x.fillText('END',436,184);
/* body ellipse */x.strokeStyle='#4aa3a0';x.lineWidth=3;x.beginPath();x.ellipse(250,180,155,85,0,0,7);x.stroke();
box(330,180,70,30,'wag tail','#8fd3c9');box(250,130,80,30,'swim','#8fd3c9');box(250,230,80,30,'if hungry','#e98a6b');box(170,180,70,30,'bite','#8fd3c9');
arrow(295,130,330,165);arrow(250,215,250,145);arrow(290,230,330,195);arrow(365,180,398,180);arrow(205,180,215,180);arrow(170,165,212,135);arrow(170,195,212,226);
/* missing head: dashed */x.setLineDash([5,5]);x.strokeStyle='#e8e2d0';x.strokeRect(20,150,70,60);x.setLineDash([]);x.fillStyle='#e8e2d0';x.fillText('head?',55,184);arrow(135,180,98,180);
x.fillStyle='#f2b84b';x.fillText('next: nothing. I ate it.',130,260);x.fillText('FLOW FISH: one frame, no loop',240,330);</script></body></html>
