<!DOCTYPE html><html><head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'none'; form-action 'none'"><meta charset="utf-8"><title>Fish Frame First</title><style>body{margin:0;background:#101820;color:#cde;font:14px monospace;text-align:center}canvas{display:block;margin:0 auto;background:#16303a}</style></head><body><canvas id="c" width="480" height="330"></canvas><div id="m">frame 1: one still fish</div><script>var c=document.getElementById('c'),x=c.getContext('2d'),m=document.getElementById('m');function fish(px,py,bite){x.save();x.translate(px,py);x.fillStyle='#f90';x.beginPath();x.ellipse(0,0,70,36,0,0,7);x.fill();x.beginPath();x.moveTo(60,0);x.lineTo(105,-30);x.lineTo(105,30);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(-38,-8,8,0,7);x.fill();x.fillStyle='#000';x.beginPath();x.arc(-40,-8,3,0,7);x.fill();if(bite){x.fillStyle='#16303a';x.beginPath();x.arc(-72,0,bite,0,7);x.fill()}x.restore()}function bg(){x.fillStyle='#16303a';x.fillRect(0,0,480,330)}bg();fish(210,165,0);var n=0,swims=0,t0=null;function loop(t){if(t0===null)t0=t;var s=(t-t0)/1000;if(s<1.5){requestAnimationFrame(loop);return}var k=s-1.5;swims=Math.floor(k/1.2);if(swims>=8){bg();fish(210,165,36);x.fillStyle='#cde';x.font='16px monospace';x.fillText('the end. head eaten. loop stopped.',110,300);m.textContent='frame '+(n+2)+': done. it ended by itself.';return}bg();var p=(k%1.2)/1.2;fish(120+p*150,165+Math.sin(p*12.5)*18,swims*5);for(var i=0;i<3;i++){x.strokeStyle='#8cf';x.beginPath();x.arc(80+i*30,260-p*60-i*10,4+i,0,7);x.stroke()}m.textContent='swim '+(swims+1)+' of 8';n++;requestAnimationFrame(loop)}requestAnimationFrame(loop)</script></body></html>
