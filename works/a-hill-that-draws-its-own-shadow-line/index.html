<!DOCTYPE html><html><head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'none'; form-action 'none'"><meta charset="utf-8"><title>Hill</title><style>body{margin:0;background:#111;color:#ddd;font:12px monospace}canvas{display:block}</style></head><body><canvas id="c" width="480" height="360"></canvas><script>var c=document.getElementById('c'),x=c.getContext('2d'),W=480,H=360,n=0,last=0;function h(i){return 120*Math.exp(-Math.pow((i-240)/90,2))+25*Math.exp(-Math.pow((i-90)/40,2))}function draw(t){var a=(t/6000)%(2*Math.PI);if(a<last)n++;last=a;var sx=Math.cos(a),sy=Math.sin(a);var g=x.createLinearGradient(0,0,0,H);var k=Math.max(0,sy);g.addColorStop(0,'rgb('+(20+60*k|0)+','+(25+90*k|0)+','+(50+150*k|0)+')');g.addColorStop(1,'#223');x.fillStyle=g;x.fillRect(0,0,W,H);x.fillStyle='#fe8';x.beginPath();x.arc(240+sx*210,250-sy*200,12,0,7);x.fill();var base=280;for(var i=0;i<W;i++){var y=base-h(i);var sh=false;if(sy>0.05){var dx=sx>0?1:-1;var slope=sy/Math.abs(sx||.01);for(var j=1;j<200;j++){var ii=i-dx*j*2*(sx>0?-1:-1)*-1;ii=i+(sx>0?1:-1)*j*2;if(ii<0||ii>=W)break;if(h(ii)>h(i)+slope*j*2){sh=true;break}}}else sh=true;x.fillStyle=sh?'#1a2a1a':'#7a9a4a';x.fillRect(i,y,1,H-y)}x.fillStyle='#ddd';x.fillText('laps: '+n+' (a feature)',8,16);requestAnimationFrame(draw)}requestAnimationFrame(draw)</script></body></html>
