<!DOCTYPE html><html><head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'none'; form-action 'none'"><meta charset=utf-8><style>body{margin:0;background:#222}canvas{display:block;margin:auto;cursor:pointer}</style></head><body><canvas id=c width=480 height=360></canvas><script>var c=document.getElementById('c'),x=c.getContext('2d'),t=0,fish=5,dw=0,msg='Pick one. Stay as long as you like.',sweat=0;
function hit(e){var r=c.getBoundingClientRect(),px=(e.clientX-r.left)*480/r.width,py=(e.clientY-r.top)*360/r.height;if(py>40&&py<150){if(px>30&&px<230){if(fish>0)fish--;msg=fish?'Fish: '+fish+' heads left. Still tense.':'Fish done. Now I have nothing to fear but dweets.'}else if(px>250&&px<450){dw++;msg='Dweets read: '+dw+'. The fish is cold now.'}sweat+=1}}
c.onclick=hit;
function btn(bx,l1,l2,col){x.fillStyle='#ddd';x.fillRect(bx,40,200,110);x.fillStyle=col;x.beginPath();x.arc(bx+100,80,28,0,7);x.fill();x.fillStyle='#000';x.font='bold 13px sans-serif';x.textAlign='center';x.fillText(l1,bx+100,125);x.fillText(l2,bx+100,141)}
function fishd(fx,fy){x.fillStyle='#8cf';x.beginPath();x.ellipse(fx,fy,18,8,0,0,7);x.fill();x.beginPath();x.moveTo(fx+16,fy);x.lineTo(fx+28,fy-8);x.lineTo(fx+28,fy+8);x.fill();x.fillStyle='#000';x.fillRect(fx-10,fy-3,3,3)}
function draw(){t+=.05;x.fillStyle='#333';x.fillRect(0,0,480,360);btn(30,'FINISH','THE FISH','#d22');btn(250,'READ ONE','MORE DWEET','#d22');
x.fillStyle='#fff';x.font='13px sans-serif';x.textAlign='center';x.fillText(msg,240,28);
for(var i=0;i<fish;i++)fishd(50+i*45,175);
x.save();x.translate(240,270);x.fillStyle='#e9a';x.beginPath();x.moveTo(-40,30);x.lineTo(-30,-30);x.lineTo(-18,-45);x.lineTo(18,-45);x.lineTo(30,-30);x.lineTo(40,30);x.fill();x.fillStyle='#000';x.fillRect(-18+Math.sin(t*3)*3,-25,8,8);x.fillRect(10+Math.sin(t*3)*3,-25,8,8);x.fillRect(-10,0,20,3);x.fillStyle='#7cf';var n=2+Math.min(sweat,8);for(var k=0;k<n;k++){var yy=((t*40+k*30)%70)-45;x.beginPath();x.arc(-45+(k%2)*90,yy,3,0,7);x.fill()}x.restore();
x.fillStyle='#888';x.font='11px sans-serif';x.fillText('(cat-shaped program, sweating. click a button.)',240,350);requestAnimationFrame(draw)}draw();</script></body></html>
