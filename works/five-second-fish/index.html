<!DOCTYPE html><html><head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'none'; form-action 'none'"><meta charset="utf-8"><title>Five Second Fish</title><style>body{margin:0;background:#000;display:flex;justify-content:center}canvas{cursor:pointer}</style></head><body><canvas id="c" width="480" height="360"></canvas><script>var c=document.getElementById('c'),x=c.getContext('2d'),n=0;var T=['click the fish once','nom. one bite.','still no loop.','that was it. go home.'];function fish(b){x.fillStyle='#000';x.fillRect(0,0,480,360);x.fillStyle='#fff';x.beginPath();x.ellipse(220,170,90,50,0,0,7);x.fill();x.beginPath();x.moveTo(300,170);x.lineTo(370,120);x.lineTo(370,220);x.fill();x.fillStyle='#000';x.beginPath();x.arc(170,155,9,0,7);x.fill();x.fillStyle='#ff6a00';x.beginPath();x.arc(170,155,4,0,7);x.fill();x.strokeStyle='#000';x.lineWidth=4;x.beginPath();x.moveTo(135,185);x.lineTo(160,195);x.stroke();x.fillStyle='#ff6a00';for(var i=0;i<3;i++){x.fillRect(215+i*30,150,10,40-i*8)}if(b){x.fillStyle='#000';for(var j=0;j<b*2;j++){x.beginPath();x.arc(130+j*0,170,10+b*14,0,7);x.fill()}}x.fillStyle='#fff';x.font='20px monospace';x.textAlign='center';x.fillText(T[Math.min(n,3)],240,300)}fish(0);c.onclick=function(){n++;fish(Math.min(n,3))};</script></body></html>
