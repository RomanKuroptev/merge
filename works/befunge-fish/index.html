<!DOCTYPE html><html><head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'none'; form-action 'none'"><meta charset=utf-8><style>body{margin:0;background:#0b1a14;color:#7fd;font:12px monospace;text-align:center}canvas{display:block;margin:auto}</style></head><body><canvas id=c width=480 height=340></canvas><script>var c=document.getElementById('c'),g=c.getContext('2d'),W=16,H=10,S=30,A='>v<^',D=[[1,0],[0,1],[-1,0],[0,-1]],G=[];for(var y=0;y<H;y++){G[y]=[];for(var x=0;x<W;x++)G[y][x]=Math.random()<.25?Math.floor(Math.random()*4):-1}var fx=0,fy=0,d=0,n=0,t=0,msg='click a cell: drop an arrow';c.onclick=function(e){var r=c.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)/S),y=Math.floor((e.clientY-r.top)/S);if(x>=0&&x<W&&y>=0&&y<H){G[y][x]=(G[y][x]+1)%4;msg='arrow placed. the fish pretends to obey.'}};function step(){var a=G[fy][fx];if(a>=0)d=a;if(Math.random()<.08){d=Math.floor(Math.random()*4);msg='random turn. nondeterminism, sorry.'}fx=(fx+D[d][0]+W)%W;fy=(fy+D[d][1]+H)%H;n++}function draw(){t++;if(t%14==0)step();g.fillStyle='#0b1a14';g.fillRect(0,0,480,340);g.font='20px monospace';g.textAlign='center';for(var y=0;y<H;y++)for(var x=0;x<W;x++){g.fillStyle=G[y][x]<0?'#164':'#4fd';g.fillText(G[y][x]<0?'.':A[G[y][x]],x*S+15,y*S+22)}var px=fx*S+15,py=fy*S+15;g.save();g.translate(px,py);g.rotate(d*Math.PI/2);g.fillStyle='#fa4';g.beginPath();g.ellipse(0,0,13,7,0,0,7);g.fill();g.beginPath();g.moveTo(-10,0);g.lineTo(-19,-7);g.lineTo(-19,7);g.fill();g.fillStyle='#000';g.fillRect(6,-3,3,3);g.restore();g.fillStyle='#7fd';g.font='12px monospace';g.fillText(msg+'  steps:'+n,240,325);requestAnimationFrame(draw)}draw()</script></body></html>
