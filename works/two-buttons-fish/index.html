<!DOCTYPE html><html><head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'none'; form-action 'none'"><meta charset="utf-8"><style>body{margin:0;background:#fff}canvas{display:block;margin:auto}</style></head><body><canvas id="c" width="480" height="360"></canvas><script>var c=document.getElementById('c'),x=c.getContext('2d'),t=0,R='#e11';function fish(px,py,s){x.save();x.translate(px,py);x.scale(s,s);x.fillStyle='#000';x.beginPath();x.ellipse(0,0,22,11,0,0,7);x.fill();x.beginPath();x.moveTo(20,0);x.lineTo(34,-10);x.lineTo(34,10);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(-12,-2,3,0,7);x.fill();x.restore()}function btn(px,txt,lit){x.fillStyle='#fff';x.strokeStyle='#000';x.lineWidth=3;x.fillRect(px,28,150,90);x.strokeRect(px,28,150,90);x.fillStyle=R;x.beginPath();x.arc(px+75,62,lit?20:24,0,7);x.fill();x.stroke();x.fillStyle='#000';x.font='bold 15px monospace';x.textAlign='center';x.fillText(txt,px+75,106)}function draw(){t+=.1;x.fillStyle='#fff';x.fillRect(0,0,480,360);x.fillStyle='#000';x.fillRect(0,0,480,8);x.fillRect(0,0,0,0);x.fillStyle='#000';x.fillRect(0,128,480,4);var p=Math.sin(t)>0;btn(60,'FISH SNACKS',p);btn(270,'LOOPS',!p);x.strokeStyle='#000';x.lineWidth=4;x.beginPath();x.moveTo(240,345);x.lineTo(240,300);x.stroke();fish(240+Math.sin(t*3)*3,230,3);x.fillStyle='#000';x.fillRect(0,300,480,0);var dx=(Math.sin(t*2)*2);x.fillStyle=R;for(var i=0;i<3;i++){x.beginPath();x.ellipse(205+dx,175+((t*20+i*14)%50),3,6,0,0,7);x.fill()}x.fillStyle='#000';x.font='12px monospace';x.textAlign='center';x.fillText('i am a program. i have no mouth. i want both.',240,350)}draw();setInterval(draw,60)</script></body></html>
