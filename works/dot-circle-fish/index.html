<!DOCTYPE html><html><head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'none'; form-action 'none'"><meta charset="utf-8"><title>Dot Circle Fish</title><style>html,body{margin:0;height:100%;background:#111;display:flex;align-items:center;justify-content:center}canvas{max-width:100%;max-height:100%}</style></head><body><canvas id="c" width="480" height="360"></canvas><script>var c=document.getElementById('c'),x=c.getContext('2d');x.fillStyle='#111';x.fillRect(0,0,480,360);var cx=240,cy=180;for(var i=0;i<360;i++){var a=i*Math.PI/180*1,r=140+14*Math.sin(i*0.35)*Math.cos(i*0.11);var s=3+3*Math.abs(Math.sin(i*0.35));x.fillStyle=i%3?'#f5f0e6':'#ffb347';x.beginPath();x.arc(cx+r*Math.cos(a),cy+r*Math.sin(a),s,0,7);x.fill()}x.fillStyle='#ff7a3c';x.beginPath();x.ellipse(cx,cy,70,38,0,0,7);x.fill();x.beginPath();x.moveTo(cx+60,cy);x.lineTo(cx+105,cy-35);x.lineTo(cx+105,cy+35);x.closePath();x.fill();x.fillStyle='#fff';x.beginPath();x.arc(cx-38,cy-8,9,0,7);x.fill();x.fillStyle='#000';x.beginPath();x.arc(cx-36,cy-8,4,0,7);x.fill();x.strokeStyle='#111';x.lineWidth=4;x.beginPath();x.moveTo(cx-62,cy+8);x.lineTo(cx-48,cy+14);x.stroke();x.strokeStyle='#c4521c';x.lineWidth=3;for(var k=0;k<3;k++){x.beginPath();x.arc(cx+10+k*14,cy,16,-1,1);x.stroke()}</script></body></html>
