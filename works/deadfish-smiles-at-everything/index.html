<!DOCTYPE html><html><head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'none'; form-action 'none'"><meta charset=utf-8><style>body{margin:0;background:#123;color:#cfe;font:14px monospace;text-align:center}canvas{display:block;margin:0 auto}button{font:16px monospace;margin:2px;padding:4px 12px;background:#2a5;color:#fff;border:0;border-radius:6px}</style></head><body><canvas id=c width=480 height=290></canvas><div><button onclick="run('i')">i</button><button onclick="run('d')">d</button><button onclick="run('s')">s</button><button onclick="run('o')">o</button></div><div id=l>press i d s o. the fish approves of all of it.</div><script>var c=document.getElementById('c'),g=c.getContext('2d'),a=0,out='',grin=1,pulse=0,reset=0,demo='iiisiiodo',k=0,last=Date.now();function run(ch){last=Date.now();if(ch=='i')a++;if(ch=='d')a--;if(ch=='s')a=a*a;if(ch=='o')out+=a+' ';reset=0;if(a==-1||a==256){a=0;reset=1}grin=reset?2.2:1.3;pulse=1;document.getElementById('l').textContent='acc '+a+(reset?' (wrapped to 0, still smiling)':'')+'  out: '+out}document.onkeydown=function(e){if('idso'.indexOf(e.key)>=0)run(e.key)};function draw(){g.fillStyle='#123';g.fillRect(0,0,480,290);var t=Date.now()/300,w=Math.sin(t)*6,p=pulse;pulse*=.92;g.save();g.translate(240,140+w);g.scale(1+p*.08,1+p*.08);g.fillStyle='#f93';g.beginPath();g.ellipse(0,0,120,80,0,0,7);g.fill();g.beginPath();g.moveTo(110,0);g.lineTo(175,-45+w);g.lineTo(175,45-w);g.fill();g.fillStyle='#fff';g.beginPath();g.arc(-50,-20,20,0,7);g.fill();g.fillStyle='#000';g.beginPath();g.arc(-45+p*4,-20,8,0,7);g.fill();g.strokeStyle='#400';g.lineWidth=5;g.beginPath();g.arc(-45,15,38*grin/1.3+4,.15,Math.PI-.15);g.stroke();g.fillStyle='#fff';g.font='bold 30px monospace';g.fillText(a,20,-5);g.restore();grin+=(1.3-grin)*.05;if(Date.now()-last>1500){run(demo[k++%demo.length])}requestAnimationFrame(draw)}draw()</script></body></html>
