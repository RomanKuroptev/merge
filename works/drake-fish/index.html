<!DOCTYPE html><html><head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'none'; form-action 'none'"><meta charset="utf-8"><style>body{margin:0;background:#1b1b3a}canvas{display:block}</style></head><body><canvas id="c" width="480" height="360"></canvas><script>var c=document.getElementById('c'),x=c.getContext('2d');
var sky='#1b1b3a',dusk='#ff8c42',glow='#ffd166',rose='#c9184a',deep='#3d2c5e',pale='#f4e1c1';
x.fillStyle=pale;x.fillRect(0,0,480,360);
function panel(y,bg){x.fillStyle=bg;x.fillRect(0,y,200,180);x.strokeStyle=sky;x.lineWidth=3;x.strokeRect(0,y,480,180)}
panel(0,dusk);panel(180,glow);
function fish(cx,cy,s,col){x.fillStyle=col;x.beginPath();x.ellipse(cx,cy,34*s,18*s,0,0,7);x.fill();x.beginPath();x.moveTo(cx+30*s,cy);x.lineTo(cx+56*s,cy-16*s);x.lineTo(cx+56*s,cy+16*s);x.fill();x.fillStyle=pale;x.beginPath();x.arc(cx-18*s,cy-4*s,4*s,0,7);x.fill();x.fillStyle=sky;x.beginPath();x.arc(cx-19*s,cy-4*s,2*s,0,7);x.fill()}
function arm(x1,y1,x2,y2){x.strokeStyle=sky;x.lineWidth=10;x.lineCap='round';x.beginPath();x.moveTo(x1,y1);x.lineTo(x2,y2);x.stroke()}
// top: fish turns away, fin up
fish(100,100,1.3,rose);
arm(60,80,40,40);
x.fillStyle=sky;x.fillRect(120,70,3,0);
// X mark of refusal
x.strokeStyle=sky;x.lineWidth=6;x.beginPath();x.moveTo(20,20);x.lineTo(50,50);x.moveTo(50,20);x.lineTo(20,50);x.stroke();
// bottom: fish with cat ears, pointing
fish(100,280,1.3,deep);
x.fillStyle=deep;x.beginPath();x.moveTo(70,265);x.lineTo(75,235);x.lineTo(92,258);x.fill();x.beginPath();x.moveTo(110,258);x.lineTo(125,235);x.lineTo(130,268);x.fill();
arm(140,285,185,265);
x.fillStyle=sky;x.beginPath();x.arc(30,205,0,0,7);x.fill();
// right half captions
x.fillStyle=pale;x.fillRect(200,0,280,360);
x.strokeStyle=sky;x.lineWidth=3;x.strokeRect(200,0,280,180);x.strokeRect(200,180,280,180);
x.fillStyle=sky;x.font='bold 19px sans-serif';x.textAlign='center';
function t(a,cx,y){for(var i=0;i<a.length;i++)x.fillText(a[i],cx,y+i*26)}
t(['Being a','real cat'],340,70);
t(['Being a cat-shaped','program eating','fish heads'],340,235);
</script></body></html>
