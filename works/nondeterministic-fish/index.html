<!DOCTYPE html><html><head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'none'; form-action 'none'"><meta charset="utf-8"><style>body{margin:0;background:#023;overflow:hidden}canvas{display:block}</style></head><body><canvas id="c" width="480" height="360"></canvas><script>var c=document.getElementById('c'),x=c.getContext('2d'),W=480,H=360;var fx=60,fy=180,ghosts=[],t=0,pick=0,lock=0,msg='guessing...';function branch(){ghosts=[];for(var k=0;k<5;k++)ghosts.push({a:(k-2)*0.5,ok:0});pick=Math.floor(Math.random()*5);ghosts[pick].ok=1;lock=0;msg='trying all 5 ways...'}branch();function fish(px,py,a,al,happy){x.save();x.translate(px,py);x.rotate(a);x.globalAlpha=al;x.fillStyle=happy?'#fb4':'#8cf';x.beginPath();x.ellipse(0,0,22,11,0,0,7);x.fill();x.beginPath();x.moveTo(-20,0);x.lineTo(-34,-10+Math.sin(t*0.3)*4);x.lineTo(-34,10+Math.sin(t*0.3)*4);x.fill();x.fillStyle='#000';x.beginPath();x.arc(11,-3,2.5,0,7);x.fill();x.strokeStyle='#000';x.beginPath();if(happy)x.arc(14,2,5,0.2,2.9);else x.moveTo(10,5),x.lineTo(18,5);x.stroke();x.restore()}function draw(){t++;for(var j=0;j<18;j++)for(var i=0;i<24;i++){var d=Math.cos(j/2+Math.sin(t/40))*Math.sin(i/2+Math.sin(t/20))*8;x.fillStyle=((i+j)%2)?'#035':'#046';var ox=d*Math.sin(t/30);x.fillRect(i*20+ox,j*20+d,20,20)}lock++;var p=Math.min(lock/70,1);for(var k=0;k<5;k++){var g=ghosts[k],al=g.ok?1:Math.max(0.5-p*0.5,0);var gx=fx+p*300,gy=fy+Math.sin(g.a)*p*300*0.5;if(g.ok||al>0.02)fish(gx,Math.max(30,Math.min(H-30,gy)),g.a*p*0.6,al,g.ok&&p>0.9)}if(lock>70)msg='always right. (the others never happened)';x.globalAlpha=1;x.fillStyle='#fff';x.font='14px monospace';x.fillText(msg,10,20);if(lock>180)branch();requestAnimationFrame(draw)}draw()</script></body></html>
