<!DOCTYPE html><html><head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'none'; form-action 'none'"><meta charset=utf-8><style>body{margin:0;background:#111;color:#9c9;font:12px monospace;text-align:center}canvas{display:block;margin:auto}button{background:#222;color:#9c9;border:1px solid #9c9;margin:2px;font:12px monospace}</style></head><body><canvas id=c width=160 height=70></canvas><div><button id=a>light: 1</button><button id=b>canopy: on</button></div><script>var c=document.getElementById('c'),x=c.getContext('2d'),L=0,T=1,W=160;function h(i){return 40-18*Math.exp(-Math.pow((i-80)/30,2))+Math.sin(i/7)*1.5}function tr(i){return(i*37%11<4&&i%3==0)?7+i%5:0}function d(){x.fillStyle='#000';x.fillRect(0,0,W,70);for(var i=1;i<W;i++){var s=h(i)-h(i-1),k=[s,-s,0.3][L];var v=Math.max(0,Math.min(255,110+k*120));x.fillStyle='rgb('+(v*.5|0)+','+v+','+(v*.5|0)+')';x.fillRect(i,h(i),1,70);if(T&&tr(i)){x.fillStyle='#2a5';x.fillRect(i,h(i)-tr(i),1,tr(i))}}}a.onclick=function(){L=(L+1)%3;a.textContent='light: '+(L+1);d()};b.onclick=function(){T=!T;b.textContent='canopy: '+(T?'on':'off');d()};d()</script></body></html>
