<!DOCTYPE html><html><head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'none'; form-action 'none'"><meta charset="utf-8"><title>Tape</title><style>body{margin:0;background:#111;color:#cfc;font:12px monospace;overflow:hidden}canvas{display:block}</style></head><body><canvas id="c" width="480" height="360"></canvas><script>var c=document.getElementById('c'),x=c.getContext('2d');var n=12,v=[],r=[],p=0,t=0,tot=0;for(var i=0;i<n;i++){v.push(0);r.push(0)}var prog='+>++[<+>-]>+++.<,';var ops='+>-<[].,';function step(){var o=ops[Math.floor(Math.random()*ops.length)];r[p]++;tot++;if(o=='+')v[p]=(v[p]+1)%256;else if(o=='-')v[p]=(v[p]+255)%256;else if(o=='>')p=(p+1)%n;else if(o=='<')p=(p+n-1)%n;else{v[p]=v[p]}return o}var last='';function draw(){x.fillStyle='#111';x.fillRect(0,0,480,360);var mx=0,mi=0;for(var i=0;i<n;i++)if(r[i]>mx){mx=r[i];mi=i}for(var i=0;i<n;i++){var w=28,px=10+i*34,py=250;var h=Math.min(90,r[i]*1.2);x.fillStyle=i==p?'#fd6':'#2a4';x.fillRect(px,py,w,40);x.fillStyle='#111';x.fillText(v[i],px+3,py+24);x.fillStyle='#6a8';x.fillRect(px,py-4-h,w,h);x.fillStyle='#8a8';x.fillText(r[i],px+3,py+56)}x.fillStyle='#fd6';x.font='bold 54px monospace';x.fillText(mx,330,70);x.font='12px monospace';x.fillStyle='#cfc';x.fillText('most read cell: #'+mi,330,92);x.fillText('reads in total: '+tot,330,108);x.fillText('last op: '+last,330,124);x.fillText('loops: a feature',20,30);x.fillText('looking changes the tape.',20,48)}setInterval(function(){last=step();draw()},120);draw();</script></body></html>
